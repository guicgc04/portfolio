<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script src="../_comum/relogio-demo.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLA Consolidado Mensal | Demo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script>
document.write('<link rel="stylesheet" href="styles.css?v=' + Date.now() + '">');
</script>
</head>
<body>

<div class="page" id="tv-root">

  <header class="header">
    <div class="header-left">
      
      <img src="../_comum/logo-demo.svg" alt="Demonstração com dados fictícios">
    </div>

    <div class="header-title">
      <h1>SLA Consolidado Mensal</h1>
    </div>

    <div class="header-right">
      <div class="updated-tag" id="updated-tag">Atualizando…</div>
    </div>
  </header>

  <div class="view active" id="view-mensal">
    <div class="view-card">
      <div class="table-wrap table-wrap-scroll">
        <table class="tabela-diaria" id="tabela-mensal">
          <thead>
            <tr id="tabela-mensal-head-row">
              <th class="resp-th">Responsável</th>
              <th class="indicador-th">Indicador</th>
            </tr>
            <tr id="tabela-mensal-ent-row" class="tonelagem-linha"></tr>
            <tr id="tabela-mensal-sai-row" class="tonelagem-linha"></tr>
            <tr id="tabela-mensal-perfil-row" class="tonelagem-linha"></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="view" id="view-diario">
    <div class="view-card">
      <div class="table-wrap table-wrap-scroll">
        <table class="tabela-diaria" id="tabela-diaria">
          <thead>
            <tr id="tabela-diaria-head-row">
              <th class="resp-th">Responsável</th>
              <th data-key="indicador">Indicador</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<nav class="tab-bar" id="tab-bar">
  <div class="tab-follow" id="tab-follow"></div>
  <button class="tab-btn active" data-view="mensal">
    <svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8M21 12a9 9 0 1 1-6.2-8.5"/></svg>
    <span class="tab-label">Mensal / Acumulado</span>
  </button>
  <button class="tab-btn" data-view="diario">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
    <span class="tab-label">Diário</span>
  </button>
</nav>

<script>
document.write('<script src="app.js?v=' + Date.now() + '"><\/script>');
</script>
</body>
</html>
